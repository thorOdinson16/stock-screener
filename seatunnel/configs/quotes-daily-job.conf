env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 10000
  checkpoint.timeout = 300000
}

source {
  Kafka {
    plugin_output = "market_quotes_daily"

    bootstrap.servers = "localhost:9092"
    topic = "market.quotes.daily"
    consumer.group = "seatunnel-bronze-quotes-daily"
    start_mode = "earliest"

    format = "json"

    schema {
      fields {
        symbol = string
        trade_date = string
        open = double
        high = double
        low = double
        close = double
        volume = bigint
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "market_quotes_daily"
    plugin_output = "quotes_daily_enriched"

    query = """
      SELECT
        symbol,
        trade_date,

        CAST(open AS DECIMAL(18, 2)) AS open,
        CAST(high AS DECIMAL(18, 2)) AS high,
        CAST(low AS DECIMAL(18, 2)) AS low,
        CAST(close AS DECIMAL(18, 2)) AS close,

        volume,

        CURRENT_TIMESTAMP() AS ingested_at

      FROM market_quotes_daily
    """
  }
}

sink {
  Iceberg {
    plugin_input = "quotes_daily_enriched"

    catalog_name = "seatunnel"

    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "hdfs://localhost:9000/warehouse"
    }

    hadoop.config = {
      fs.defaultFS = "hdfs://localhost:9000"
    }

    namespace = "bronze"
    table = "quotes_daily"

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 134217728
    }
  }
}
