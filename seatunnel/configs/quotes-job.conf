env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 10000
  checkpoint.timeout = 300000
}

source {
  Kafka {
    plugin_output = "market_quotes"

    bootstrap.servers = "localhost:9092"
    topic = "market.quotes"
    consumer.group = "seatunnel-bronze-quotes"
    start_mode = "earliest"

    format = "json"

    schema {
      fields {
        symbol = string
        timestamp = string
        open = double
        high = double
        low = double
        close = double
        volume = bigint
        previous_close = double
        change_percent = double
        market_cap = double
        sector = string
        industry = string
        exchange = string
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "market_quotes"
    plugin_output = "quotes_enriched"

    query = """
      SELECT
        symbol,

        REPLACE(timestamp, '+00:00', 'Z') AS timestamp,

        CAST(open AS DECIMAL(18, 2)) AS open,
        CAST(high AS DECIMAL(18, 2)) AS high,
        CAST(low AS DECIMAL(18, 2)) AS low,
        CAST(close AS DECIMAL(18, 2)) AS close,

        volume,

        CAST(previous_close AS DECIMAL(18, 2)) AS previous_close,

        change_percent,

        CAST(market_cap AS DECIMAL(20, 2)) AS market_cap,

        sector,
        industry,
        exchange,

        CURRENT_TIMESTAMP() AS ingested_at

      FROM market_quotes
    """
  }
}

sink {
  Iceberg {
    plugin_input = "quotes_enriched"

    catalog_name = "seatunnel"

    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "hdfs://localhost:9000/warehouse"
    }

    hadoop.config = {
      fs.defaultFS = "hdfs://localhost:9000"
    }

    namespace = "bronze"
    table = "market_quotes"

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 134217728
    }
  }
}