env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 10000
  checkpoint.timeout = 300000
}

source {
  Kafka {
    plugin_output = "market_quotes"

    bootstrap.servers = "localhost:9092"
    topic = "market.quotes"
    consumer.group = "seatunnel-bronze-quotes"
    start_mode = "group_offsets"

    kafka.config = {
      auto.offset.reset = "earliest"
    }

    format = "json"

    schema {
      fields {
        symbol = string
        timestamp = string
        open = double
        high = double
        low = double
        close = double
        volume = bigint
        previous_close = double
        change_percent = double
        market_cap = double
        sector = string
        industry = string
        exchange = string
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "market_quotes"
    plugin_output = "quotes_normalized"

    query = """
      SELECT
        symbol,

        REPLACE(timestamp, '+00:00', 'Z') AS timestamp,

        CAST(open AS DECIMAL(18, 2)) AS open,
        CAST(high AS DECIMAL(18, 2)) AS high,
        CAST(low AS DECIMAL(18, 2)) AS low,
        CAST(close AS DECIMAL(18, 2)) AS close,

        volume,

        CAST(previous_close AS DECIMAL(18, 2)) AS previous_close,

        change_percent,

        CAST(market_cap AS DECIMAL(20, 2)) AS market_cap,

        sector,
        industry,
        exchange,

        CURRENT_TIMESTAMP() AS ingested_at,

        CASE
          WHEN symbol IS NULL OR symbol = '' THEN 'missing_symbol'
          WHEN close IS NULL THEN 'missing_close'
          WHEN close <= 0 THEN 'non_positive_close'
          WHEN volume IS NOT NULL AND volume < 0 THEN 'negative_volume'
          ELSE NULL
        END AS reason

      FROM market_quotes
    """
  }

  Sql {
    plugin_input = "quotes_normalized"
    plugin_output = "quotes_valid"

    query = """
      SELECT
        symbol, timestamp, open, high, low, close, volume,
        previous_close, change_percent, market_cap, sector, industry, exchange, ingested_at
      FROM quotes_normalized
      WHERE reason IS NULL
    """
  }

  Sql {
    plugin_input = "quotes_normalized"
    plugin_output = "quotes_deadletter"

    query = """
      SELECT
        symbol,
        'market.quotes' AS source_topic,
        reason,
        CURRENT_TIMESTAMP() AS failed_at,
        timestamp,
        close,
        volume,
        change_percent
      FROM quotes_normalized
      WHERE reason IS NOT NULL
    """
  }
}

sink {
  Iceberg {
    plugin_input = "quotes_valid"

    catalog_name = "seatunnel"

    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "hdfs://localhost:9000/warehouse"
    }

    hadoop.config = {
      fs.defaultFS = "hdfs://localhost:9000"
    }

    namespace = "bronze"
    table = "market_quotes"

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 134217728
    }
  }

  Kafka {
    plugin_input = "quotes_deadletter"

    bootstrap.servers = "localhost:9092"
    topic = "market.deadletter"
    format = "json"
  }
}
