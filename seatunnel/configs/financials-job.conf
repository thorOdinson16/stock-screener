env {
  job.mode = "BATCH"
  parallelism = 2
  checkpoint.interval = 10000
  checkpoint.timeout = 120000
}

source {
  Kafka {
    plugin_output = "financial_statements"

    bootstrap.servers = "localhost:9092"
    topic = "market.financials"
    consumer.group = "seatunnel-bronze-financials"
    start_mode = "group_offsets"

    kafka.config = {
      auto.offset.reset = "earliest"
    }

    format = "json"

    schema {
      fields {
        symbol = string
        period_end = string
        fetched_at = string
        total_revenue = double
        net_income = double
        diluted_eps = double
        stockholders_equity = double
        total_debt = double
        shares_outstanding = double
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "financial_statements"
    plugin_output = "financials_normalized"

    query = """
      SELECT
        symbol,
        period_end,
        REPLACE(fetched_at, '+00:00', 'Z') AS fetched_at,
        total_revenue,
        net_income,
        diluted_eps,
        stockholders_equity,
        total_debt,
        shares_outstanding,

        CURRENT_TIMESTAMP() AS ingested_at,

        CASE
          WHEN symbol IS NULL OR symbol = '' THEN 'missing_symbol'
          WHEN period_end IS NULL OR period_end = '' THEN 'missing_period_end'
          ELSE NULL
        END AS reason

      FROM financial_statements
    """
  }

  Sql {
    plugin_input = "financials_normalized"
    plugin_output = "financials_valid"

    query = """
      SELECT
        symbol, period_end, fetched_at, total_revenue, net_income, diluted_eps,
        stockholders_equity, total_debt, shares_outstanding, ingested_at
      FROM financials_normalized
      WHERE reason IS NULL
    """
  }

  Sql {
    plugin_input = "financials_normalized"
    plugin_output = "financials_deadletter"

    query = """
      SELECT
        symbol,
        'market.financials' AS source_topic,
        reason,
        CURRENT_TIMESTAMP() AS failed_at,
        period_end,
        fetched_at
      FROM financials_normalized
      WHERE reason IS NOT NULL
    """
  }
}

sink {
  Iceberg {
    plugin_input = "financials_valid"

    catalog_name = "seatunnel"

    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "hdfs://localhost:9000/warehouse"
    }

    hadoop.config = {
      fs.defaultFS = "hdfs://localhost:9000"
    }

    namespace = "bronze"
    table = "financial_statements"

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 134217728
    }
  }

  Kafka {
    plugin_input = "financials_deadletter"

    bootstrap.servers = "localhost:9092"
    topic = "market.deadletter"
    format = "json"
  }
}
