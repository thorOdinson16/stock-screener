env {
  job.mode = "BATCH"
  parallelism = 2
  checkpoint.interval = 10000
  checkpoint.timeout = 120000
}

source {
  Kafka {
    plugin_output = "market_fundamentals"

    bootstrap.servers = "localhost:9092"
    topic = "market.fundamentals"
    consumer.group = "seatunnel-bronze-fundamentals"
    start_mode = "group_offsets"

    kafka.config = {
      auto.offset.reset = "earliest"
    }

    format = "json"

    schema {
      fields {
        symbol = string
        timestamp = string
        pe_ratio = double
        pb_ratio = double
        eps = double
        dividend_yield = double
        market_cap = double
        beta = double
        fifty_two_week_high = double
        fifty_two_week_low = double
        return_on_equity = double
        debt_to_equity = double
        revenue_growth = double
        earnings_growth = double
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "market_fundamentals"
    plugin_output = "fundamentals_normalized"

    query = """
      SELECT
        symbol,

        REPLACE(timestamp, '+00:00', 'Z') AS timestamp,

        pe_ratio,
        pb_ratio,
        eps,
        dividend_yield,
        market_cap,
        beta,
        fifty_two_week_high,
        fifty_two_week_low,
        return_on_equity,
        debt_to_equity,
        revenue_growth,
        earnings_growth,

        CURRENT_TIMESTAMP() AS ingested_at,

        CASE
          WHEN symbol IS NULL OR symbol = '' THEN 'missing_symbol'
          ELSE NULL
        END AS reason

      FROM market_fundamentals
    """
  }

  Sql {
    plugin_input = "fundamentals_normalized"
    plugin_output = "fundamentals_valid"

    query = """
      SELECT
        symbol, timestamp, pe_ratio, pb_ratio, eps, dividend_yield, market_cap, beta,
        fifty_two_week_high, fifty_two_week_low, return_on_equity, debt_to_equity,
        revenue_growth, earnings_growth, ingested_at
      FROM fundamentals_normalized
      WHERE reason IS NULL
    """
  }

  Sql {
    plugin_input = "fundamentals_normalized"
    plugin_output = "fundamentals_deadletter"

    query = """
      SELECT
        symbol,
        'market.fundamentals' AS source_topic,
        reason,
        CURRENT_TIMESTAMP() AS failed_at,
        timestamp,
        pe_ratio,
        pb_ratio
      FROM fundamentals_normalized
      WHERE reason IS NOT NULL
    """
  }
}

sink {
  Iceberg {
    plugin_input = "fundamentals_valid"

    catalog_name = "seatunnel"

    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "hdfs://localhost:9000/warehouse"
    }

    hadoop.config = {
      fs.defaultFS = "hdfs://localhost:9000"
    }

    namespace = "bronze"
    table = "market_fundamentals"

    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"

    iceberg.table.write-props = {
      write.format.default = "parquet"
      write.target-file-size-bytes = 134217728
    }
  }

  Kafka {
    plugin_input = "fundamentals_deadletter"

    bootstrap.servers = "localhost:9092"
    topic = "market.deadletter"
    format = "json"
  }
}
