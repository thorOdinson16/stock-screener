# Serves the built dashboard on :5173 (the same port as the native Vite dev
# server) and proxies /api to FastAPI, like vite.config.ts does natively. All
# containers share one network namespace, so the API is on localhost.
server {
    listen 5173;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
